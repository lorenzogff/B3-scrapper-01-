        function aplicarOrdenacao(idTabela) {
            var tabela = document.getElementById(idTabela);
            var style = document.createElement("style");

            var initialBackgroundImageUrl = "/aspnet_client/system_web/2_0_50727/Themes/SiteBmfBovespa/Grid/Skins/SiteBmfBovespa/img/SortDesc.gif";
            var sortUpBackgroundImageUrl = "/aspnet_client/system_web/2_0_50727/Themes/SiteBmfBovespa/Grid/Skins/SiteBmfBovespa/img/SortDesc.gif";
            var sortDownBackgroundImageUrl = "/aspnet_client/system_web/2_0_50727/Themes/SiteBmfBovespa/Grid/Skins/SiteBmfBovespa/img/SortAsc.gif";

            var columnsInitialBackgroundImage = [];
            var columnsSortUpBackgroundImage = [];
            var columnsSortDownBackgroundImage = [];

            var styleHtml = [];

            $(tabela).tablesorter();

            style.type = "text/css";

            $(tabela).find("th").each(function (index, element) {
                var columnClassName = idTabela + "_col" + index;
                var leftPosition = element.firstChild.offsetLeft + element.firstChild.offsetWidth;
                var middleSpot = element.firstChild.offsetTop + (element.firstChild.offsetHeight / 2);
                var initialTop = middleSpot - 4;
                var sortUpTop = initialTop;
                var sortDownTop = middleSpot - 7;

                columnsInitialBackgroundImage.push("#" + idTabela + " th." + columnClassName + " { background-position: " + leftPosition + "px " + initialTop + "px; }");
                columnsSortUpBackgroundImage.push("#" + idTabela + " th.headerSortUp." + columnClassName + " { background-position: " + leftPosition + "px " + sortUpTop + "px; }");
                columnsSortDownBackgroundImage.push("#" + idTabela + " th.headerSortDown." + columnClassName + " { background-position: " + leftPosition + "px " + sortDownTop + "px; }");

                $(element).addClass(columnClassName);
            });

            styleHtml.push("#" + idTabela + " th                { background-image: url('" + initialBackgroundImageUrl + "'); background-repeat: no-repeat; }");
            styleHtml.push("#" + idTabela + " th.headerSortUp   { background-image: url('" + sortUpBackgroundImageUrl + "'); }");
            styleHtml.push("#" + idTabela + " th.headerSortDown { background-image: url('" + sortDownBackgroundImageUrl + "'); }");

            styleHtml.push(columnsInitialBackgroundImage.join("\n"));
            styleHtml.push(columnsSortUpBackgroundImage.join("\n"));
            styleHtml.push(columnsSortDownBackgroundImage.join("\n"));

            if (style.styleSheet) {
                style.styleSheet.cssText = styleHtml.join("\n");
            }
            else {
                style.appendChild(document.createTextNode(styleHtml.join("\n")));
            }

            document.getElementsByTagName("head")[0].appendChild(style);
        }
	</script>
